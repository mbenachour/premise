name: typecheck

on:
  push:
    branches: [dev, premise]
  pull_request:
    branches: [dev, premise]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
